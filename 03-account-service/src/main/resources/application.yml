# local dev profile, same shared docker-compose postgres and kafka as the rest of the services
spring:
  application:
    name: 03-account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: dbadmin
    password: localdevpassword
    driver-class-name: org.postgresql.Driver
  kafka:
    # consumes "user-events" (published by auth-service on registration) to provision a starter
    # account for a brand-new user - see UserRegisteredListener. No producer here, account-service
    # never publishes anything of its own.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  # auth-service and profile-service already have tables sitting in this same shared local
  # "banking" database via Hibernate ddl-auto (they don't use Flyway at all) - Flyway refuses to
  # touch a non-empty schema with no history table as a safety check, so baseline it locally.
  # Not needed in prod, where each service is expected to have its own dedicated database.
  flyway:
    baseline-on-migrate: true
    # default baseline-version is "1", which collides with this service's own V1 migration and
    # would make Flyway skip it (thinking it's already covered by the baseline) - 0 guarantees
    # V1 onward still actually run.
    baseline-version: "0"
    # transaction-service's V3/V4/V5/V7 migrations already exist in this same shared history table
    # (its own migration files aren't on this service's classpath) - tell Flyway that's expected
    # instead of failing validation on "migration applied but not resolved locally". Mirrors the
    # same tolerance transaction-service's own config already grants for this service's V1/V2.
    # "future" is needed alongside "missing" because the two services interleave version numbers:
    # anything applied above this service's own highest local version (V6) - transaction-service's
    # V7, say - is classified "future", not "missing", and would still fail validation otherwise.
    ignore-migration-patterns: "*:missing,*:future"

server:
  port: 8083
  # Internal callers (transaction-service's AccountServiceClient) parse this message field to
  # translate a rejected transfer/debit back into the same error locally - Spring Boot hides it
  # by default for security, but these are service-to-service endpoints, not public ones.
  error:
    include-message: always

app:
  demo:
    enabled: true
