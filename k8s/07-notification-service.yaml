# notification service deployment, listens on kafka for transfer/profile events and sends alert emails,
# only running one replica since this is a background worker, not something that takes direct traffic
# since nothing calls this directly, one copy is enough for now, could bump replicas later
# purely to process kafka messages faster in parallel, not to handle more inbound requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: banking-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: your-docker-registry/notification-service:latest
          ports:
            - containerPort: 8080
          # this one skips envFrom on purpose, no db credentials needed since it has no database of its own,
          # just kafka to consume events and redis, probably for retry/rate limit state down the line
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.banking-app.svc.cluster.local:9092"
            - name: REDIS_HOST
              value: "redis-master.banking-app.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # Twilio (SMS 2FA) and SendGrid (summaries/alerts) credentials.
            #
            # These deliberately reference a secret that is NOT in this repo. Unlike
            # banking-db-secret in 02-secrets.yaml, which holds obviously-fake placeholder values,
            # these are real credentials that can be used to send messages billed to your account -
            # so the manifest holding them must never be committed. Create it directly instead:
            #
            #   kubectl create secret generic banking-notification-secret \
            #     --namespace banking-app \
            #     --from-literal=TWILIO_ACCOUNT_SID=... \
            #     --from-literal=TWILIO_AUTH_TOKEN=... \
            #     --from-literal=TWILIO_FROM_NUMBER=+15551234567 \
            #     --from-literal=SENDGRID_API_KEY=... \
            #     --from-literal=SENDGRID_FROM_EMAIL=alerts@yourdomain.com
            #
            # optional: true on every key means the pod still starts without this secret present -
            # it just falls back to the logging providers rather than crash-looping.
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: banking-notification-secret
                  key: TWILIO_ACCOUNT_SID
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: banking-notification-secret
                  key: TWILIO_AUTH_TOKEN
                  optional: true
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: banking-notification-secret
                  key: TWILIO_FROM_NUMBER
                  optional: true
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: banking-notification-secret
                  key: SENDGRID_API_KEY
                  optional: true
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: banking-notification-secret
                  key: SENDGRID_FROM_EMAIL
                  optional: true
---
# clusterip even though nothing external hits this service directly, keeping it consistent with the others
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: banking-app
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 8080
      targetPort: 8080