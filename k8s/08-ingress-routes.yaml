# this is the one object that actually routes outside traffic to the right internal service
# based on the url path, everything else in k8s/ so far has just been clusterip services
# that only talk to each other inside the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking-app
  # this annotation is what tells the cluster which ingress controller should actually
  # handle these rules, has to match whatever controller is installed, nginx here
  annotations:
    kubernetes.io/ingress.class: "nginx"

spec:
  rules:
    - http:
        paths:
          # pathType prefix means /api/v1/auth also matches things like /api/v1/auth/login,
          # not just an exact match on the literal path string
          # 1. Auth traffic (login/2FA/refresh/logout - see AuthController)
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080

          # 2. Account Traffic
          - path: /api/v1/accounts
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  number: 8080

          # 3. Transaction Traffic
          - path: /api/v1/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8080

          # 4. Transfer Traffic (TransferController lives inside transaction-service,
          # there is no separate transfer-service deployment)
          - path: /api/v1/transfers
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8080

          # 5. Profile Traffic (ProfileController / PreferenceController)
          - path: /api/v1/profiles
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 8080

          # 6. Alert preference traffic - PreferenceController is mapped at the SINGULAR
          # /api/v1/profile/alerts, which the plural rule above does not match: pathType Prefix
          # compares whole path segments, so "/api/v1/profiles" never matches "/api/v1/profile/...".
          # Without this rule the Alert Preferences page 404s behind the ingress even though it works
          # fine against docker-compose.
          #
          # Note this is only safe because every endpoint under this prefix requires authentication.
          # The two that can't (notification-service reads a user's threshold and the daily-summary
          # opt-ins with no end-user token) were moved to /api/v1/internal/, which is deliberately
          # absent from this file - adding an unauthenticated endpoint under a routed prefix would
          # publish it, and these responses carry email addresses.
          - path: /api/v1/profile
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 8080

          # 7. Notification history (NotificationController) - the frontend's Notifications page
          # reads it. notification-service is otherwise a pure Kafka consumer, which is why it had no
          # rule here at all; the endpoint was added later and this file was never updated, so the
          # page 404s behind the ingress while working fine against docker-compose - the same failure
          # as rule 6 above, from a different cause.
          #
          # Safe for the same reason rule 6 is: NotificationController is annotated
          # @PreAuthorize("hasAuthority('SCOPE_FULL_AUTH')"), so every path this exposes needs a
          # fully authenticated token. It also cannot reach the unauthenticated internal endpoints -
          # those live under /api/v1/internal/notifications/..., and Prefix compares whole segments,
          # so "/api/v1/notifications" never matches a path whose third segment is "internal".
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080
