# local dev stack, spins up the shared infra all six services need without touching k8s at all
# just run docker compose up and point each service's application.yml at localhost for these
services:
  # local postgres, one instance shared across every service for now, each service just uses its own tables
  postgres:
    image: postgres:15.4
    container_name: banking-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5433:5432"
    volumes:
      - banking_postgres_data:/var/lib/postgresql/data

  # local kafka broker running in kraft mode, so there is no separate zookeeper container needed locally
  # this is different from the helm values file which still uses zookeeper for the real cluster chart
  kafka:
    image: apache/kafka:3.7.0
    container_name: banking-kafka-local
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # auto create topics on locally so I do not have to manually declare every topic while developing
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # replication factor of 1 since this is a single broker, would need to be higher in a real cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - banking_kafka_data:/var/lib/kafka/data

  # local redis for notification-service's caching, no password needed since this never leaves localhost
  redis:
    image: redis:7
    container_name: banking-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./01-auth-service
      dockerfile: Dockerfile
    container_name: banking-auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: localdevpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka

  profile-service:
    build:
      context: ./02-profile-service
      dockerfile: Dockerfile
    container_name: banking-profile-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: localdevpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_FLYWAY_ENABLED: "false"
      APPLICATION_CLIENT_AUTH_SERVICE_URL: http://host.docker.internal:8081
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
      - auth-service

  account-service:
    build:
      context: ./03-account-service
      dockerfile: Dockerfile
    container_name: banking-account-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: localdevpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APPLICATION_CLIENT_PROFILE_SERVICE_URL: http://profile-service:8082
      INTERNAL_SERVICE_TOKEN: local-dev-internal-token
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - kafka
      - profile-service

  transaction-service:
    build:
      context: ./03-transaction-service
      dockerfile: Dockerfile
    container_name: banking-transaction-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: localdevpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8083
      APPLICATION_CLIENT_AUTH_SERVICE_URL: http://host.docker.internal:8081
      APPLICATION_CLIENT_PROFILE_SERVICE_URL: http://profile-service:8082
      INTERNAL_SERVICE_TOKEN: local-dev-internal-token
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - kafka
      - auth-service
      - profile-service
      - account-service

  notification-service:
    build:
      context: ./04-notification-service
      dockerfile: Dockerfile
    container_name: banking-notification-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: localdevpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_SERVICE_URL: http://auth-service:8081
      PROFILE_SERVICE_URL: http://profile-service:8082
      ACCOUNT_SERVICE_URL: http://account-service:8083
      INTERNAL_SERVICE_TOKEN: local-dev-internal-token
      EMAIL_PROVIDER: logging
      SMS_PROVIDER: logging
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - kafka
      - redis
      - auth-service
      - profile-service
      - account-service

  audit-service:
    build:
      context: ./05-audit-service
      dockerfile: Dockerfile
    container_name: banking-audit-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: localdevpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - kafka

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"

# named volumes so postgres and kafka data survive a container restart, not just a fresh container every time
volumes:
  banking_postgres_data:
  banking_kafka_data:
