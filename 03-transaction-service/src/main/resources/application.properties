# local dev profile, this one is in properties format instead of yaml unlike the other services,
# functionally the exact same settings, just a different file format
spring.application.name=03-transaction-service

spring.datasource.url=jdbc:postgresql://localhost:5432/banking
spring.datasource.username=dbadmin
spring.datasource.password=localdevpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# auth-service and profile-service already have tables sitting in this same shared local
# "banking" database via Hibernate ddl-auto (they don't use Flyway at all) - Flyway refuses to
# touch a non-empty schema with no history table as a safety check, so baseline it locally.
# Not needed in prod, where each service is expected to have its own dedicated database.
spring.flyway.baseline-on-migrate=true
# account-service's V1/V2/V6 migrations already exist in this same shared history table (its own
# migration files aren't on this service's classpath, only V3/V4/V5/V7 are) - tell Flyway that's
# expected instead of failing validation on "migration applied but not resolved locally".
# "future" is needed alongside "missing" because the two services interleave version numbers: once
# account-service adds a version above this service's own highest local one, it gets classified
# "future", not "missing", and would still fail validation otherwise.
spring.flyway.ignore-migration-patterns=*:missing,*:future

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# KafkaTemplate<String, FundsTransferredEvent>/<String, LargeTransferRequestedEvent> publish real
# event objects, not pre-serialized strings - without this, Spring Boot defaults to StringSerializer
# for the value too, which throws a ClassCastException the instant a real event object is sent.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# account-service is the sole owner of the accounts/transactions tables - this is how
# TransferService/ExternalWireService reach it to move money, instead of touching the DB directly
application.client.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8083}

server.port=8084
# Without this, Spring strips the "message" field out of every error response this service didn't
# explicitly handle, so a real reason that already travelled all the way here (account-service says
# INSUFFICIENT_FUNDS -> FeignErrorConfig's ErrorDecoder unpacks it -> ResponseStatusException) got
# thrown away at the last step and the frontend could only show a generic failure. account-service
# sets the same thing for the same reason.
server.error.include-message=always
