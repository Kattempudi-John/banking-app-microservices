# local dev profile, points at the same docker-compose postgres and kafka every other service uses locally
spring:
  application:
    name: 02-profile-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: dbadmin
    password: localdevpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # KafkaTemplate<String, Object> here publishes real ProfileUpdatedEvent/KycStatusUpdatedEvent
    # objects, not pre-serialized strings - without this, Spring Boot defaults to StringSerializer
    # for the value too, which throws a ClassCastException the instant a real event object is sent.
    # add.type.headers=false because the consumers (audit/notification-service) have their own,
    # separately-defined event classes with the same shape, not this exact class on their classpath.
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  # this service's tables already exist in the same shared local "banking" database via Hibernate
  # ddl-auto (V2/V3 migrations assume tables Flyway itself never created) - Flyway refuses to
  # touch a non-empty schema with no history table as a safety check, so baseline it locally.
  # Not needed in prod, where this service is expected to have its own dedicated database.
  flyway:
    baseline-on-migrate: true
    # unlike account-service, this service's tables were already being built by Hibernate
    # ddl-auto for a long time before Flyway was ever added here - V2 and V3 are already
    # physically present locally, so baseline AT version 3 (not 0) to make Flyway treat both
    # as already applied instead of trying to re-run their statements against existing tables.
    baseline-version: "3"
    # account/transaction-service already occupy version numbers 1-4 in the shared local
    # database's default flyway_schema_history table (different content, same version numbers
    # this service would also use) - a service-specific table name avoids that collision without
    # needing a separate Postgres schema, since this service's tables share the same schema/
    # search_path as the rest of the Hibernate-managed tables.
    table: flyway_schema_history_profile

server:
  # own port so this can run alongside auth-service and the rest locally without clashing
  port: 8082

app:
  demo:
    enabled: true

application:
  security:
    # Shared secret required on every /api/v1/internal/** request (InternalTokenFilter) and attached
    # to every internal call this service makes out (FeignInternalTokenConfig). The property name,
    # header and dev default are identical in all five services - it is a contract between them, so
    # changing it here alone locks this service out of the others and them out of this one.
    # Declared in the base config rather than only in the prod profile so the env var is picked up
    # under any profile; the literal fallback keeps docker-compose working with zero configuration
    # while a real deployment sets INTERNAL_SERVICE_TOKEN from the same k8s secret everywhere.
    internal-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
