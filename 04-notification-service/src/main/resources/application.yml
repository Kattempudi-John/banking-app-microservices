# local dev profile, points at the docker-compose postgres, kafka and redis all running on localhost
spring:
  application:
    name: 04-notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: dbadmin
    password: localdevpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    # NOTE the nesting: this has to be spring.jpa.properties.hibernate.default_schema. It was
    # previously one level deeper, under spring.jpa.hibernate.properties, which Spring ignores
    # entirely - so Hibernate fell back to the "public" schema, quietly created a SECOND
    # notification_records table there via ddl-auto, and wrote every record into it while the
    # Flyway-managed notification.notification_records sat empty. Email alerts then failed outright,
    # because that accidental table typed message as varchar(255) and the HTML bodies are longer.
    properties:
      hibernate:
        default_schema: notification
    show-sql: true
  # account-service and transaction-service already occupy version numbers 1-7 in this shared
  # local database's public schema/flyway history - this service's own V1 would collide there
  # (different content, same version number), so it gets its own schema instead, same as
  # 05-audit-service does.
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # the only service with a redis block, backs whatever caching ProfileServiceClient does with @cacheable
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Which SMS provider is used IF something sends an SMS. Nothing in the app does any more: 2FA codes
# moved to email, which was the only feature that ever sent one. The clients are kept rather than
# deleted because they still work and SMS is a plausible future channel (fraud alerts, say) - but
# treat this whole block as dormant, and expect no SMS traffic in a normal run.
#
# "logging" is the default here and in the prod profile, so no environment ever needs SMS credentials
# to start - LoggingSmsProviderClient just writes the message to the log. Exactly one client bean
# matches the chosen value (@ConditionalOnProperty on each), so Spring is never ambiguous.
#
#   logging  - no credentials, logs instead of sending (default)
#   textbelt - free tier needs no signup at all, 1 text/day/IP, good for a one-off end-to-end check
#   twilio   - real delivery
#
# IMPORTANT: this file is tracked by git. Every credential below is read from an environment
# variable with a blank fallback - set them in the gitignored .env (see .env.example) or export them
# in your shell. Never replace a ${VAR:} placeholder with a literal value here: anything committed
# to git stays in the history even after it is deleted, and a leaked Twilio auth token or SendGrid
# API key can be used to send messages billed to your account.
sms:
  provider: ${SMS_PROVIDER:logging}
  textbelt-key: ${TEXTBELT_KEY:textbelt}
  twilio:
    # Leaving these blank with provider=twilio fails startup on purpose - a credential missing from a
    # provider someone explicitly asked for should be an obvious error at boot, not a message that
    # silently never arrives. It is also why provider must stay "logging" unless all three are set:
    # this is the pair of facts that used to crash-loop the prod pod.
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    # Must be a number Twilio has actually issued to your account, in E.164 format (+15551234567).
    from-number: ${TWILIO_FROM_NUMBER:}

# Which provider delivers every notification this service sends: 2FA codes, balance summaries,
# transaction alerts, and profile security notices. 2FA used to be SMS-only and is now email like
# the rest, which makes this the one provider setting that matters - if email is misconfigured,
# nobody can log in, not just nobody gets their morning summary.
#
#   logging  - no credentials, logs instead of sending (default in this dev profile only)
#   twilio   - real delivery via Twilio Email (POST https://comms.twilio.com/v1/Emails)
#   sendgrid - real delivery via the classic SendGrid v3 API
#
# The two real options are different products with different credentials, which is the whole reason
# both clients exist. Twilio Email reuses the sms.twilio.* account SID and auth token above, so it
# needs no new secret - only a verified sender. SendGrid is a separate API with its own key, and its
# single-sender verification works without DNS access, which is why it, not Twilio Email, is the one
# prod actually runs on (see application-prod.yml, where sendgrid is the default).
#
# Local dev stays on "logging": a 2FA code printed in the console is easier to work with than one
# waiting in an inbox, and it keeps a checkout with no credentials at all fully able to log in.
email:
  provider: ${EMAIL_PROVIDER:logging}
  twilio:
    # No credentials here on purpose - they come from sms.twilio.* above. One Twilio account, one
    # SID/token pair; a second copy would just be a second thing to rotate and forget.
    # Has to be an address whose sender identity is verified in the Twilio console, or every send
    # is rejected.
    from-email: ${TWILIO_FROM_EMAIL:}
    # Display name on the From header. Cosmetic, so unlike the address it gets a real default.
    from-name: ${TWILIO_FROM_NAME:Banking Alerts}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    # Has to be an address verified as a sender in SendGrid, or every send is rejected.
    from-email: ${SENDGRID_FROM_EMAIL:}

# notification.daily-summary.hour used to live here, one global hour the whole bank's summaries fired
# at. Each user now picks their own hour and it arrives on their preferences record, so a global
# override could only do harm: it would either be ignored or force every customer back onto one hour,
# which is the exact thing the per-user setting exists to end. The way to watch the job run without
# waiting for someone's morning is the manual trigger,
# POST /api/v1/internal/notifications/daily-summary/run, which skips the hour check entirely.

server:
  port: 8085

application:
  security:
    # Shared secret required on every /api/v1/internal/** request (InternalTokenFilter) and attached
    # to every internal call this service makes out (FeignInternalTokenConfig). The property name,
    # header and dev default are identical in all five services - it is a contract between them, so
    # changing it here alone locks this service out of the others and them out of this one.
    # Declared in the base config rather than only in the prod profile so the env var is picked up
    # under any profile; the literal fallback keeps docker-compose working with zero configuration
    # while a real deployment sets INTERNAL_SERVICE_TOKEN from the same k8s secret everywhere.
    internal-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
