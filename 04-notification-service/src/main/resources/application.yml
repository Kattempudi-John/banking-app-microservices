# local dev profile, points at the docker-compose postgres, kafka and redis all running on localhost
spring:
  application:
    name: 04-notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: dbadmin
    password: localdevpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    # NOTE the nesting: this has to be spring.jpa.properties.hibernate.default_schema. It was
    # previously one level deeper, under spring.jpa.hibernate.properties, which Spring ignores
    # entirely - so Hibernate fell back to the "public" schema, quietly created a SECOND
    # notification_records table there via ddl-auto, and wrote every record into it while the
    # Flyway-managed notification.notification_records sat empty. Email alerts then failed outright,
    # because that accidental table typed message as varchar(255) and the HTML bodies are longer.
    properties:
      hibernate:
        default_schema: notification
    show-sql: true
  # account-service and transaction-service already occupy version numbers 1-7 in this shared
  # local database's public schema/flyway history - this service's own V1 would collide there
  # (different content, same version number), so it gets its own schema instead, same as
  # 05-audit-service does.
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # the only service with a redis block, backs whatever caching ProfileServiceClient does with @cacheable
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Which SMS provider actually delivers 2FA codes. "logging" is the default so local dev and CI never
# need credentials - LoggingSmsProviderClient just writes the message to the log. Exactly one client
# bean matches the chosen value (@ConditionalOnProperty on each), so Spring is never ambiguous.
#
#   logging  - no credentials, logs instead of sending (default)
#   textbelt - free tier needs no signup at all, 1 text/day/IP, good for a one-off end-to-end check
#   twilio   - real delivery
#
# IMPORTANT: this file is tracked by git. Every credential below is read from an environment
# variable with a blank fallback - set them in the gitignored .env (see .env.example) or export them
# in your shell. Never replace a ${VAR:} placeholder with a literal value here: anything committed
# to git stays in the history even after it is deleted, and a leaked Twilio auth token can be used
# to send messages billed to your account.
sms:
  provider: ${SMS_PROVIDER:logging}
  textbelt-key: ${TEXTBELT_KEY:textbelt}
  twilio:
    # Leaving these blank with provider=twilio fails startup on purpose, rather than letting a login
    # hang on a 2FA code that was never really sent.
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    # Must be a number Twilio has actually issued to your account, in E.164 format (+15551234567).
    from-number: ${TWILIO_FROM_NUMBER:}

# Which provider delivers balance summaries, transaction alerts, and profile security notices.
# 2FA never goes over email; it's SMS only.
#
#   logging  - no credentials, logs instead of sending (default)
#   twilio   - real delivery via Twilio Email (POST https://comms.twilio.com/v1/Emails)
#   sendgrid - real delivery via the classic SendGrid v3 API
#
# The two real options are different products with different credentials, which is the whole reason
# both clients exist. Twilio Email reuses the sms.twilio.* account SID and auth token above, so it
# needs no new secret - only a verified sender. SendGrid is a separate API with its own key, and its
# single-sender verification works without DNS access, which makes it the fallback when domain
# authentication isn't possible.
email:
  provider: ${EMAIL_PROVIDER:logging}
  twilio:
    # No credentials here on purpose - they come from sms.twilio.* above. One Twilio account, one
    # SID/token pair; a second copy would just be a second thing to rotate and forget.
    # Has to be an address whose sender identity is verified in the Twilio console, or every send
    # is rejected.
    from-email: ${TWILIO_FROM_EMAIL:}
    # Display name on the From header. Cosmetic, so unlike the address it gets a real default.
    from-name: ${TWILIO_FROM_NAME:Banking Alerts}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    # Has to be an address verified as a sender in SendGrid, or every send is rejected.
    from-email: ${SENDGRID_FROM_EMAIL:}

# DailyBalanceSummaryJob's hourly cron sweeps for timezones whose local time is currently this hour
# and mails the opted-in users there. Configurable purely so it can be pointed at the current hour
# to watch the scheduled path run for real, instead of waiting until 8am somewhere relevant.
notification:
  daily-summary:
    hour: ${DAILY_SUMMARY_HOUR:8}

server:
  port: 8085
