# prod profile, redis host here points at the in cluster redis-master service from the bitnami
# helm chart, matching REDIS_HOST set directly in k8s/07-notification-service.yaml
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

# Feign targets. The @FeignClient annotations default to localhost for docker-compose dev;
# in the cluster these point at the in-cluster k8s service DNS names instead (same pattern as
# transaction-service's application-prod.properties), overridable per-env via the *_SERVICE_URL vars.
profile-service:
  url: ${PROFILE_SERVICE_URL:http://profile-service:8080}
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://account-service:8080}
# Only used to put a name on a transaction alert's counterparty (AuthServiceClient). A wrong or
# unreachable value here degrades the alert to a masked account number rather than failing it, so
# this is the one client whose misconfiguration is invisible in the logs of a working system.
auth-service:
  url: ${AUTH_SERVICE_URL:http://auth-service:8080}

# 2FA is delivered over email now, so SendGrid is the only provider prod has to be able to reach, and
# the only one whose credentials are mandatory here.
#
# sms.provider defaults to "logging", NOT "twilio". It used to default to twilio, and that was a live
# outage waiting to happen: TwilioSmsProviderClient's @PostConstruct throws IllegalStateException the
# moment one of its three credentials is blank, and all three fall back to blank below - so a cluster
# carrying only SendGrid secrets crash-looped this pod at startup, with nothing wrong except that it
# was asked for a provider 2FA no longer uses. The SMS clients stay wired up rather than deleted
# (Textbelt and Twilio are still useful for a one-off manual check, and for whatever non-2FA use SMS
# may get later), they are simply dormant. Turning Twilio back on means setting SMS_PROVIDER=twilio
# AND all three TWILIO_* values together - one without the other is exactly the crash above.
sms:
  provider: ${SMS_PROVIDER:logging}
  textbelt-key: ${TEXTBELT_KEY:textbelt}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

# Email is the whole notification path in prod - 2FA codes, balance summaries, transaction alerts -
# so unlike the dev profile it defaults to real delivery: a prod pod quietly writing 2FA codes into
# its own log instead of sending them is worse than one that refuses to start. SendGridEmailProviderClient
# enforces that, throwing at boot when either value below is blank. That is why the two SENDGRID_* keys
# in k8s/07-notification-service.yaml are the required ones and the TWILIO_* keys are not.
email:
  provider: ${EMAIL_PROVIDER:sendgrid}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:}

server:
  port: 8080
