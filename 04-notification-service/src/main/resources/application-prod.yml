# prod profile, redis host here points at the in cluster redis-master service from the bitnami
# helm chart, matching REDIS_HOST set directly in k8s/07-notification-service.yaml
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

# Feign targets. The @FeignClient annotations default to localhost for docker-compose dev;
# in the cluster these point at the in-cluster k8s service DNS names instead (same pattern as
# transaction-service's application-prod.properties), overridable per-env via the *_SERVICE_URL vars.
profile-service:
  url: ${PROFILE_SERVICE_URL:http://profile-service:8080}
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://account-service:8080}

# Prod defaults to the real providers, unlike the dev profile which defaults to logging. Every
# credential comes from the environment - none of these have an inline fallback, so a missing secret
# fails startup loudly instead of quietly downgrading to logging and dropping real notifications.
sms:
  provider: ${SMS_PROVIDER:twilio}
  textbelt-key: ${TEXTBELT_KEY:textbelt}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

email:
  provider: ${EMAIL_PROVIDER:sendgrid}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:}

server:
  port: 8080
